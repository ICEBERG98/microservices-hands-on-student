apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: microshop
spec:
  replicas: 2
  selector:
    matchLabels: {app: storefront}
  template:
    metadata:
      labels: {app: storefront}
    spec:
      containers:
        - name: storefront
          image: microshop-storefront:local
          imagePullPolicy: Never
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: microshop-config}
          startupProbe:
            httpGet: {path: /health/startup, port: http}
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: microshop
spec:
  selector: {app: storefront}
  ports:
    - {name: http, port: 80, targetPort: http}
