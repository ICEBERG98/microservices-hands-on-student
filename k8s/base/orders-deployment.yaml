apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: orders
  name: orders
  namespace: microshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders
  strategy: {}
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
      - image: microshop-orders:local
        name: orders
        ports:
          - name: http
            containerPort: 8082
        envFrom:
          - configMapRef:
              name: microshop-config
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 1
            memory: 128Mi
        volumeMounts:
          - name: data
            mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: order-data