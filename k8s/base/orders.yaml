apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orders-data
  namespace: microshop
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 100Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: microshop
spec:
  replicas: 1
  selector:
    matchLabels: {app: orders}
  template:
    metadata:
      labels: {app: orders}
    spec:
      containers:
        - name: orders
          image: microshop-orders:local
          imagePullPolicy: Never
          ports:
            - {name: http, containerPort: 8082}
          envFrom:
            - configMapRef: {name: microshop-config}
          startupProbe:
            httpGet: {path: /health/startup, port: http}
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: orders-data}
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: microshop
spec:
  selector: {app: orders}
  ports:
    - {name: http, port: 8082, targetPort: http}
